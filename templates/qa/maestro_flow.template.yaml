# Maestro Autonomous QA Verification Flow: {{FEATURE_NAME}}
# Generated by Universal AI Toolkit v2 (toolkit qa)
# Target Package: {{PACKAGE_NAME}}

appId: {{APP_ID}}
tags:
  - qa
  - {{FEATURE_NAME}}
  - regression

---

# 1. Launch Application
- launchApp:
    clearState: true

# 2. Navigate to Feature Screen
- tapOn:
    id: "{{NAV_TRIGGER_ID}}"
    optional: true

# --- State 1: Default / Loaded State Verification ---
- assertVisible:
    id: "{{PRIMARY_CONTENT_ID}}"
- takeScreenshot: "reports/{{FEATURE_NAME}}/01_default_loaded"

# --- State 2: Simulated Loading State ---
# Trigger loading or refetch
- scroll:
    direction: DOWN
    optional: true
- takeScreenshot: "reports/{{FEATURE_NAME}}/02_loading_state"

# --- State 3: Empty State Verification (Conditional) ---
# When testing empty state dataset
- takeScreenshot: "reports/{{FEATURE_NAME}}/03_empty_state"

# --- State 4: Error State & Retry Trigger ---
# Check that error view displays retry CTA
- assertVisible:
    text: ".*(Retry|إعادة المحاولة|Try Again).*"
    optional: true
- takeScreenshot: "reports/{{FEATURE_NAME}}/04_error_state"

# --- State 5: Orientation & Overflow Check ---
- setOrientation: LANDSCAPE
- assertNotVisible:
    text: ".*A RenderFlex overflowed by.*"
- setOrientation: PORTRAIT
