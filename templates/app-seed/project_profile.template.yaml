# Project Profile Specification
# Generated by Universal AI Toolkit v2 (toolkit init)
# This file is the single source of truth for all AI agents working on this codebase.

project_name: "{{PROJECT_NAME}}"
project_type: "{{PROJECT_TYPE}}" # single_app | multi_flavor | multi_package | monorepo
flavors:
{{FLAVORS_LIST}}

# Architecture & Organization
architecture: "{{ARCHITECTURE}}" # feature_first_clean | layer_first | modular | custom

# State Management & Data
state_management: "{{STATE_MANAGEMENT}}" # bloc_cubit | riverpod | provider | mobx | signals | none
network_client: "{{NETWORK_CLIENT}}" # dio | retrofit | http | graphql | none
dependency_injection: "{{DEPENDENCY_INJECTION}}" # injectable_get_it | riverpod | none_manual
navigation: "{{NAVIGATION}}" # go_router | auto_route | navigator_2 | getx_nav

# Localization & Direction
localization:
  engine: "{{L10N_ENGINE}}" # arb_gen_l10n | easy_localization_json | slang | none
  default_locale: "{{DEFAULT_LOCALE}}"
  supported_locales:
{{SUPPORTED_LOCALES_LIST}}
directionality: "{{DIRECTIONALITY}}" # rtl_first | ltr_first | bi_directional

# Design System & UI Constraints
design_system:
  tokens_path: "{{TOKENS_PATH}}" # e.g. lib/core/configs/values or lib/theme
  source: "{{DESIGN_SOURCE}}" # google_stitch_mcp | google_stitch_folder | figma_mcp | figma_folder | manual
  strict_mode: {{STRICT_DESIGN_MODE}} # true: enforces zero-hardcoding for colors, text sizes, and padding

# Quality & Testing Gate
testing_gate: "{{TESTING_GATE}}" # strict (mandatory per phase) | recommended | mvp_disabled

# Optional Environments & Secrets
secrets_management:
  enabled: {{SECRETS_ENABLED}}
  strategy: "{{SECRETS_STRATEGY}}" # dart_define | env_file | none

# Living Documentation Engine
living_documentation:
  living_readme: true
  feature_readmes: true

# Autonomous QA & Verification Engine
qa_verification:
  enabled: true
  runner: maestro # maestro | flutter_integration | patrol
  device:
    platform: android # android | ios
    preferred_avd: "{{PREFERRED_AVD}}"
  tolerance: semantic # semantic | strict
  auto_fix_max_retries: 3
  flows_path: test/qa_flows
  reports_path: test/qa_reports
  states_to_test:
    - default
    - loading
    - empty
    - error
    - offline

# Design System Shared Wrappers (paths relative to project root)
custom_tokens:
  button: "{{TOKEN_BUTTON_PATH}}"
  back_button: "{{TOKEN_BACK_BUTTON_PATH}}"
  image: "{{TOKEN_IMAGE_PATH}}"
  svg_icon: "{{TOKEN_SVG_PATH}}"
  text_field: "{{TOKEN_TEXT_FIELD_PATH}}"
  loading_widget: "{{TOKEN_LOADING_PATH}}"

# Baseline Infrastructure & Capabilities
capabilities:
  release_signing: false
  icons_and_splash: false
  network_interceptors: false
  permissions:
    media: false
    location: false
    notifications: false
  store_updater: false
