# Preset: Flutter Official Lean MVP
# Best for: Fast MVP delivery, robust foundation following Flutter Docs recommendations
# State: Provider | Routing: GoRouter | Network: Dio | DI: GetIt | L10n: Flutter ARB | Storage: Secure+Prefs

project_name: "mvp_app"
project_type: "single_app"
flavors: []
architecture: "feature_first"
state_management: "provider"
network_client: "dio"
dependency_injection: "get_it"
navigation: "go_router"
localization:
  engine: "arb_gen_l10n"
  default_locale: "ar"
  supported_locales:
    - "ar"
    - "en"
directionality: "rtl_first"
storage: "secure_and_prefs"
data_modeling: "manual"
design_system:
  tokens_path: "lib/core/theme"
  source: "manual"
  strict_mode: false
testing_gate: "mvp_disabled"
secrets_management:
  enabled: true
  strategy: "dart_define"
living_documentation:
  living_readme: true
  feature_readmes: false
qa_verification:
  enabled: false
  runner: "maestro"
  device:
    platform: "android"
    preferred_avd: "Pixel_7_API_34"
  tolerance: "semantic"
  auto_fix_max_retries: 1
  flows_path: "test/qa_flows"
  reports_path: "test/qa_reports"
  states_to_test:
    - "default"
    - "error"
custom_tokens:
  button: "lib/common/widgets/custom_button.dart"
  back_button: "lib/common/widgets/back_icon.dart"
  image: "lib/common/widgets/network_image_loader.dart"
  svg_icon: "lib/common/widgets/svg_icon.dart"
  text_field: "lib/common/widgets/custom_text_field.dart"
  loading_widget: "lib/common/widgets/loading_spinner.dart"
